<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Panels Zelda 💪</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC' rel='stylesheet' type='text/css'>
</head>
<body>
   
  <style>
    html {
      box-sizing: border-box;
      background: #ffc600;
      font-family: 'helvetica neue';
      font-size: 20px;
      font-weight: 200;
    }
    
    body {
      margin: 0;
    }
    
    *, *:before, *:after {
      box-sizing: inherit;
    }

    .panels {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
    }

    .panel {
      background: #6B0F9C;
      box-shadow: inset 0 0 0 5px rgba(255,255,255,0.1);
      color: white;
      text-align: center;
      align-items: center;
      /* Safari transitionend event.propertyName === flex */
      /* Chrome + FF transitionend event.propertyName === flex-grow */
      transition:
        font-size 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        flex 0.7s cubic-bezier(0.61,-0.19, 0.7,-0.11),
        background 0.2s;
      font-size: 20px;
      background-size: cover;
      background-position: center;
      flex: 1;
      justify-content: center;
      align-items: center;
      display: flex;
      flex-direction: column;
    }

    .panel1 { background-image:url("assets/zelda 1.jpg"); }
    .panel2 { background-image:url("assets/zelda 2.png"); }
    .panel3 { background-image:url("assets/zelda 3.jpg"); }
    .panel4 { background-image:url("assets/zelda 4.jpg"); }
    .panel5 { background-image:url("assets/zelda 5.jpg"); }

    /* Flex Children */
    .panel > * {
      margin: 0;
      width: 100%;
      transition: transform 0.5s;
      flex: 1 0 auto;
      justify-content: center;
      align-items: center;
      display: flex;
    }

    .panel > *:first-child {transform: translateY(-100%);}
    .panel.open-active > *:first-child { transform: translateY(0);}
    .panel > *:last-child {transform: translateY(100%);}
    .panel.open-active > *:last-child { transform: translateY(0);}

    .panel p {
      text-transform: uppercase;
      font-family: 'Amatic SC', cursive;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.72), 0 0 14px rgba(0, 0, 0, 0.45);
      font-size: 2em;
    }
    
    .panel p:nth-child(2) {
      font-size: 4em;
    }

    .panel.open {
      font-size: 40px;
      flex: 5;
    }

    .audio-interface {
  background: rgba(0, 0, 0, 0.8);
  color: white;
  padding: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  font-family: 'helvetica neue', sans-serif;
  border-bottom: 2px solid #6B0F9C; /* Un toque de color para combinar */
}

#playPauseBtn {
  background: #6B0F9C;
  border: none;
  color: white;
  padding: 8px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.3s;
}

#playPauseBtn:hover {
  background: #8e24aa;
}

#trackName {
  font-size: 0.9em;
  letter-spacing: 1px;
  text-transform: uppercase;
}

  </style>

<div class="audio-interface">
  <button id="playPauseBtn">Reproducir</button>
  <span id="trackName">Selecciona un panel</span>
</div>
  <div class="panels">
  
      <audio id="bgMusic" src="Zeldas Lullaby - The Legend of Zelda Skyward Sword.mp3" preload="auto"></audio>
    <div class="panel panel1" data-audio="Field - Day.mp3" data-title="Field">
      <p>Hey</p>
      <p>Let's</p>
      <p>Explore</p>
    </div>
    <div class="panel panel2" data-audio="Stables.mp3" data-title="Stables">
      <p>Give</p>
      <p>Take</p>
      <p>Fight</p>
    </div>
    <div class="panel panel3" data-audio="Teba's Theme.mp3" data-title="Teba's Theme">
      <p>Play</p>
      <p>It</p>
      <p>Today</p>
    </div>
    <div class="panel panel4" data-audio="Temple Of Time.mp3" data-title="Temple of Time">
      <p>Be</p>
      <p>All</p>
      <p>Fierce</p>
    </div>
    <div class="panel panel5" data-audio="Zeldas Lullaby - The Legend of Zelda Skyward Sword.mp3" data-title="Zelda's Lullaby">
      <p>Walk</p>
      <p>In</p>
      <p>Gaming</p>
    </div>
  </div>

  <script>
    const panels = document.querySelectorAll('.panel');
const audio = document.getElementById('bgMusic');
const playPauseBtn = document.getElementById('playPauseBtn');
const trackName = document.getElementById('trackName');

function toggleOpen() {
  // 1. Animación del panel
  this.classList.toggle('open');
  
  // 2. Obtener los datos del panel
  const newSrc = this.getAttribute('data-audio');
  const title = this.getAttribute('data-title');
  const middleText = this.querySelector('p:nth-child(2)').innerText;

  // 3. Lógica inteligente de audio
  if (newSrc) {
    // Si la canción es diferente a la que está sonando, la cambiamos
    // Usamos .includes() porque audio.src a veces devuelve la URL completa
    if (!audio.src.includes(newSrc)) {
      audio.src = newSrc;
      
      // Prioridad: Si hay data-title usa ese, si no, usa el texto del panel
      trackName.innerText = "Playing: " + (title || middleText);
      
      audio.play().catch(e => console.log("Error al reproducir:", e));
      playPauseBtn.innerText = "Pausar";
    } else {
      // Si es la misma canción, simplemente le damos Play/Pause
      if (audio.paused) {
        audio.play();
        playPauseBtn.innerText = "Pausar";
      } else {
        audio.pause();
        playPauseBtn.innerText = "Reproducir";
      }
    }
  }
}

// Botón de Play/Pause
playPauseBtn.addEventListener('click', () => {
  if (audio.paused) {
    audio.play();
    playPauseBtn.innerText = 'Pausar';
  } else {
    audio.pause();
    playPauseBtn.innerText = 'Reproducir';
  }
});

    function toggleActive (e){
      if(e.propertyName.includes('flex')){
      this.classList.toggle('open-active')
      }
    }
    panels.forEach(panel => panel.addEventListener('click', toggleOpen));
    panels.forEach(panel => panel.addEventListener('transitionend', toggleActive));
  </script>



</body>
</html>
